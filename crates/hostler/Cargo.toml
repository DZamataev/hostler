[package]
name = "hostler"
version = "0.0.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Machine-wide resource coordinator for parallel AI agents: the heavy-task queue first"
repository = "https://github.com/DZamataev/hostler"
homepage = "https://github.com/DZamataev/hostler"
readme = "../../README.md"
keywords = ["agents", "devices", "queue", "worktree", "lease"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests/**", "examples/**"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hostler"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
interprocess = { version = "2.4", features = ["tokio"] }
keepass = { version = "0.17.0", features = ["save_kdbx4"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-argon2 = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-util = { version = "0.7.20", features = ["codec", "rt"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
assert_cmd = "2.2.2"
escargot = "1.0.1"
predicates = "3.1.4"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_ErrorReporting"] }
